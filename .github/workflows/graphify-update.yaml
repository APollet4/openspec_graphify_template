name: Update Graphify

on:
  #schedule:
  # Every Monday at 8AM UTC
  #- cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install --upgrade graphify

      - name: Regenerate code graph
        run: graphify extract . --code-only

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            graphify-out
          commit-message: "chore(graphify): refresh code graph"
          title: "chore(graphify): refresh code graph"
          body: |
            Regenerates the project code graph with Graphify.

            Graphify cache and intermediate files are excluded from the PR.
          branch: chore/update-graphify
